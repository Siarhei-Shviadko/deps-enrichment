[tool.poetry]
name = "enrichment"
version = "0.1.0"
description = "Service for storing additional document information"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
dependency-injector = "^4.48.0"
pydantic = "^1.8.1"
click = "^8.1.3"
sentry-sdk = "^1.1.0"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "^2.0"
h11 = "^0.16.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
urllib3 = "^2.6.3"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18.0"
bandit = "^1.7.5"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
ipdb = "^0.13.9"
httpx = ">=0.27,<1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "supplement: marks Supplement tests",
    "extra_field: marks ExtraField tests",
    "extra_data: marks ExtraData tests",
]
