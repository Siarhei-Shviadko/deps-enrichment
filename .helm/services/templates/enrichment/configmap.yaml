apiVersion: v1
kind: ConfigMap
metadata:
  name: enrichment-configmap
  labels:
    {{- include "deps-enrichment.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.enrichment_settings.ENV }}
  DATABASE_PORT: '{{ .Values.enrichment_settings.DATABASE_PORT }}'
  DATABASE_DIALECT: '{{ .Values.enrichment_settings.DATABASE_DIALECT }}'
  DATABASE_DRIVER: '{{ .Values.enrichment_settings.DATABASE_DRIVER }}'
  DATABASE_REQUIRE_SECURE_TRANSPORT: '{{ .Values.enrichment_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}'

  {{- if .Values.enrichment_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
  DATABASE_SSLKEY: {{ .Values.migration_settings.DATABASE_SSLKEY_PATH }}
  DATABASE_SSLCERT: {{ .Values.migration_settings.DATABASE_SSLCERT_PATH }}
  DATABASE_SSLROOTCERT: {{ .Values.migration_settings.DATABASE_SSLROOTCERT_PATH }}
  {{- end }}

  AUTH_VERIFY_SSL: '{{ .Values.enrichment_settings.AUTH_VERIFY_SSL }}'

  LOG_LEVEL: '{{ .Values.enrichment_settings.LOG_LEVEL }}'
  DOCUMENTATION_ENABLED: '{{ .Values.enrichment_settings.DOCUMENTATION_ENABLED }}'

  KAFKA_GROUP_ID: '{{ .Values.enrichment_settings.KAFKA_GROUP_ID }}'
  KAFKA_AUTO_OFFSET_RESET: '{{ .Values.enrichment_settings.KAFKA_AUTO_OFFSET_RESET }}'

  {{ if .Values.enrichment_settings.RABBITMQ_TLS_ENABLED }}
  RABBITMQ_TLS_HOST: '{{ .Values.enrichment_settings.RABBITMQ_TLS_HOST }}'
  RABBITMQ_TLS_PORT: '{{ .Values.enrichment_settings.RABBITMQ_TLS_PORT }}'
  RABBITMQ_TLS_USER: '{{ .Values.enrichment_settings.RABBITMQ_TLS_USER }}'
  RABBITMQ_TLS_VHOST: '{{ .Values.enrichment_settings.RABBITMQ_TLS_VHOST }}'
  RABBITMQ_TLS_SUBJECT: '{{ .Values.enrichment_settings.RABBITMQ_TLS_SUBJECT }}'
  RABBITMQ_TLS_CA_CERT: '{{ .Values.enrichment_settings.RABBITMQ_TLS_CA_CERT }}'
  RABBITMQ_TLS_CLIENT_CERT: '{{ .Values.enrichment_settings.RABBITMQ_TLS_CLIENT_CERT }}'
  RABBITMQ_TLS_CLIENT_KEY: '{{ .Values.enrichment_settings.RABBITMQ_TLS_CLIENT_KEY }}'
  {{ end }}

  {{ if .Values.enrichment_settings.KAFKA_SECURITY_ENABLED }}
  KAFKA_SASL_MECHANISM: '{{ .Values.enrichment_settings.KAFKA_SASL_MECHANISM }}'
  KAFKA_SECURITY_PROTOCOL: '{{ .Values.enrichment_settings.KAFKA_SECURITY_PROTOCOL }}'
  {{ end }}
  {{- if .Values.message_broker_asb_without_manage_permission.enabled | quote }}
  ASB_SUBSCRIPTION_STRATEGY: '{{ .Values.enrichment_settings.ASB_SUBSCRIPTION_STRATEGY }}'
  {{- end }}

  # Telemetry
  INSTRUMENTATION_ENABLED: '{{ .Values.enrichment_settings.INSTRUMENTATION_ENABLED }}'
  SERVICE_NAME: '{{ .Values.enrichment_settings.SERVICE_NAME }}'
  EXPORTER_TYPE: '{{ .Values.enrichment_settings.EXPORTER_TYPE }}'
