enrichment:
  image:
    path: "/deps-platform/deps-enrichment"
  resources: {}

enrichment_settings:
  ENV: qa

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  # Telemetry
  INSTRUMENTATION_ENABLED: true

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

enrichment_consumer:
  image:
    path: "/deps-platform/deps-enrichment"

migrator:
  image:
    path: "/deps-platform/deps-enrichment-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
