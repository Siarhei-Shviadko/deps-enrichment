enrichment:
  image:
    path: "/deps-platform/deps-enrichment"
  resources: {}

enrichment_settings:
  ENV: demo

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

enrichment_consumer:
  image:
    path: "/deps-platform/deps-enrichment"

migrator:
  image:
    path: "/deps-platform/deps-enrichment-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-demo'
  roleName: 'k8s-demo'
  vaultKubernetesMountPath: 'kubernetes-demo'

service_account:
  serviceAccountName: 'deps-demo'
